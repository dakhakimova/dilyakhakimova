<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Такой страницы нет · Диля Хакимова</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preload" href="/fonts/onest-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css?v=202611497">
<link rel="stylesheet" href="/tokens.css?v=202611497">
<link rel="stylesheet" href="/home.css?v=202611497">
</head>
<!-- Страница 404 для Cloudflare Pages: без неё на любой несуществующий адрес отдаётся главная с кодом 200. -->
<body class="t-page">
<header class="top wrap" data-chrome>
  <a class="home-line" href="/">← На главную</a>
  <nav id="site-nav" aria-label="Разделы сайта">
    <a href="/play/" data-rub="play">Игры</a>
    <a href="/shelf/" data-rub="shelf">Полка</a>
    <a href="/terms/" data-rub="terms">Словарь</a>
    <a href="/extras/" data-rub="extras">Плюшки</a>
  </nav>
  <button class="burger" type="button" aria-expanded="false" aria-controls="site-nav"><span class="vh">Меню</span><span class="burger-i" aria-hidden="true"></span></button>
  <a class="me" href="/account.html" aria-label="Войти"><span class="me-i" aria-hidden="true"></span></a>
</header>
<script>(function(){var h=document.currentScript.previousElementSibling,b=h.querySelector('.burger');b.addEventListener('click',function(){var o=h.classList.toggle('open');b.setAttribute('aria-expanded',o)})})()</script>
<script>(function(){var a=document.querySelector('header.top .me');if(!a)return;var m=null;try{m=JSON.parse(localStorage.getItem('dk:me')||'null')}catch(e){}if(!m)return;a.setAttribute('aria-label','Мой кабинет');a.classList.add('in');var i=a.querySelector('.me-i');if(!i)return;if(m.name){i.className='me-l';i.textContent=m.name.trim().charAt(0).toUpperCase()}var s=m.photo||(/^(cat|dog)-\d+$/.test(m.avatar||'')?'/img/avatars/'+m.avatar+'.webp':'');if(s){var g=new Image();g.alt='';g.src=s;g.onload=function(){i.replaceWith(g)}}})()</script>
<main class="wrap block nf" id="main">
  <div class="col">
    <!-- картинка img/404-kotejka.jpg (Котейка с фонариком); если не загрузится, figure удаляется по onerror — пустого места нет -->
    <figure class="art nf-art" hidden><img src="/img/404-kotejka.jpg" width="1200" height="750" alt="Котейка светит фонариком в пустую комнату" onload="this.parentNode.hidden=false" onerror="this.parentNode.remove()"></figure>
    <p class="kicker nf-code">Ошибка 404</p>
    <h1>Такой страницы нет</h1>
    <p class="sub">Котейка посветил фонариком — пусто. Наверное, ссылка устарела или в&nbsp;адресе опечатка.</p>
  </div>
</main>
<footer class="foot" data-chrome>
  <div class="wrap">
    <p class="foot-line">Бесплатные курсы: <a href="/probability/">Вероятность на пальцах</a> · <a href="/signal/">Сигнал или шум</a></p>
    <p class="foot-line"><a href="/about/">Об авторе</a> · © 2026 Диля Хакимова</p>
  </div>
</footer>
</body>
</html>
